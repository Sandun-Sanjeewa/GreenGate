services:

 mongo: 
  image: mongo:7
  container_name: greengate-mongo
  restart: always
  volumes:
   - mongo_data:/data/db
  networks:
   - greengate-network

  healthcheck:
   test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
   interval: 10s
   timeout: 5s
   retries: 5

 server: 
  # build:
  #  context: ./server
  #  dockerfile: ../docker/prod/Dockerfile.server.prod
  
  image: sandunsanjeewa/greengate-server:latest
  container_name: greengate-server
  ports:
   - "5000:5000"
  env_file:
   - .env.base
   - .env.prod
  restart: always
  networks:
   - greengate-network
  depends_on:
   mongo:
    condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
    interval: 10s
    timeout: 5s
    retries: 5


 client:
  # build:
  #  context: ./Client
  #  dockerfile: ../docker/prod/Dockerfile.client.prod

  image: sandunsanjeewa/greengate-client:latest
  container_name: greengate-client
  restart: always
  networks:
   - greengate-network
  depends_on:
   server:
    condition: service_healthy

 nginx: 
  #image: greengate-client
  # image: nginx:alpine
  image: sandunsanjeewa/greengate-nginx:latest
  container_name: greengate-nginx
  restart: always
  ports:
   - "80:80"
  networks:
   - greengate-network
  depends_on:
   client:
    condition: service_started
   server:
    condition: service_healthy

volumes:
 mongo_data:

networks:
 greengate-network:
  driver: bridge

    