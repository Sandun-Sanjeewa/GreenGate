services:
 mongo:
  image: mongo:7
  container_name: greengate-mongo
  ports:
   - "27017:27017"
  restart: always
  volumes:
   - mongo_data:/data/db
  networks:
   - greengate-network 
 server:

  build:
   context: ./server
   dockerfile: ../docker/dev/Dockerfile.server.dev
  container_name: greengate-server

  ports:
   - "5000:5000"
  
  env_file:
   - .env.base
   - .env.dev
  restart: always 

  volumes:
   - ./server:/app
   - server_node_modules:/app/node_modules

  environment:
   - CHOKIDAR_USEPOLLING=true
  networks: 
   - greengate-network
  depends_on:
   - mongo
 

 client:
  build:
   context: ./Client
   dockerfile: ../docker/dev/Dockerfile.client.dev

  container_name: greengate-client
  restart: always
  ports:
   - "5173:5173"
  
  networks: 
   - greengate-network

  volumes:
   - ./Client:/app
   - client_node_modules:/app/node_modules

  environment:
   - CHOKIDAR_USEPOLLING=true

  depends_on:
   - server

volumes:
 mongo_data:
 server_node_modules:
 client_node_modules:

networks:
  greengate-network:
   driver: bridge
