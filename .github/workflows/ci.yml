   - name: Build & Push Client Image
     run: |
      docker build \
       -f docker/prod/Dockerfile.client.prod \
       -t sandunsanjeewa/greengate-client:latest \
       ./Client
      docker push sandunsanjeewa/greengate-client:latest


   - name: Build & Push Server Image
     run: |
      docker build \
       -f docker/prod/Dockerfile.server.prod \
       -t sandunsanjeewa/greengate-server:latest \
       ./server
      docker push sandunsanjeewa/greengate-server:latest

   - name: Build & Push Nginx Image
     run: |
      docker build \
       -f docker/prod/Dockerfile.nginx.prod \
       -t sandunsanjeewa/greengate-nginx:latest \
       .
      docker push sandunsanjeewa/greengate-nginx:latest