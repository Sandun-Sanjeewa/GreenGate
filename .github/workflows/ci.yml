name: GreenGate CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: ./Client
          file: docker/prod/Dockerfile.client.prod
          push: true
          tags: |
            sandunsanjeewa/greengate-client:latest
            sandunsanjeewa/greengate-client:${{ github.sha }}

      - name: Build & Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: docker/prod/Dockerfile.server.prod
          push: true
          tags: |
            sandunsanjeewa/greengate-server:latest
            sandunsanjeewa/greengate-server:${{ github.sha }}

      - name: Build & Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/prod/Dockerfile.nginx.prod
          push: true
          tags: |
            sandunsanjeewa/greengate-nginx:latest
            sandunsanjeewa/greengate-nginx:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            cd /home/ubuntu/GreenGate
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
          EOF
